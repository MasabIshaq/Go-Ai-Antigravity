name: Generate Keystore

on: 
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Generate Keystore and Fingerprint
        run: |
          keytool -genkey -v -keystore goai-release.keystore -alias goai -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Go Ai, OU=Go Projects, O=Go Projects, L=City, S=State, C=US" -storepass goai123 -keypass goai123
          keytool -list -v -keystore goai-release.keystore -storepass goai123 > fingerprint.txt
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-Keystore
          path: |
            goai-release.keystore
            fingerprint.txt
